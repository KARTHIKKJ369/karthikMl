[project]
name = "karthikml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "mlx>=0.32.1",
    "mlx-lm>=0.31.3",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "tiktoken>=0.14.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.15.1",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

